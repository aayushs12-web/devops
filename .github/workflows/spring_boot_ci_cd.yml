name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'docker/app1-hello/springboot/hello-spring/**'
      - '.github/workflows/spring_boot_ci_cd.yml'
      - 'k8s/app1-hello/**'
  pull_request:
    branches:
      - main
    paths:
      - 'docker/app1-hello/springboot/hello-spring/**'
  workflow_dispatch:

env:
  DOCKER_REPO: aayushlabs/hello-spring
  JAVA_VERSION: '21'
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build-and-test:
    name: Build, Test & Package Spring Boot App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker/app1-hello/springboot/hello-spring

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw Executable
        run: |
          if [ -f "mvnw" ]; then
            sed -i 's/\r$//' mvnw
            chmod +x mvnw
          fi

      - name: Verify Environment & Maven Version
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== Maven Version ==="
          if [ -f "./.mvn/wrapper/maven-wrapper.properties" ]; then
            ./mvnw --version
          else
            mvn --version
          fi

      - name: Run Unit Tests & Code Check
        run: |
          if [ -f "./.mvn/wrapper/maven-wrapper.properties" ]; then
            ./mvnw clean test
          else
            mvn clean test
          fi

      - name: Upload Test Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-surefire-test-reports
          path: docker/app1-hello/springboot/hello-spring/target/surefire-reports/
          retention-days: 5

      - name: Build & Package Application JAR
        run: |
          if [ -f "./.mvn/wrapper/maven-wrapper.properties" ]; then
            ./mvnw package -DskipTests=false
          else
            mvn package -DskipTests=false
          fi

      - name: Upload Build Artifacts (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app-jar
          path: docker/app1-hello/springboot/hello-spring/target/*.jar
          retention-days: 5

  docker-build-push:
    name: Docker Build & Push to Docker Hub
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: docker/app1-hello/springboot/hello-spring

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifact (JAR)
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-app-jar
          path: docker/app1-hello/springboot/hello-spring/target

      - name: Debug Secret Presence (Length Check)
        run: |
          echo "DOCKERHUB_USERNAME length: ${#DOCKERHUB_USERNAME}"
          echo "DOCKERHUB_TOKEN length: ${#DOCKERHUB_TOKEN}"
          echo "DOCKER_PASSWORD length: ${#DOCKER_PASSWORD}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Docker Hub Credentials Secret
        run: |
          D_USER="${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'aayushlabs' }}"
          D_TOKEN="${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKER_TOKEN }}"
          if [ -z "$D_TOKEN" ]; then
            echo "❌ ERROR: No Docker Hub Password or Token secret found in GitHub Secrets!"
            echo "👉 Go to: https://github.com/aayushs12-web/devops/settings/secrets/actions"
            echo "👉 Add 'DOCKERHUB_TOKEN' under Repository secrets."
            exit 1
          else
            echo "✅ Docker secret is present. Authenticating as: $D_USER"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'aayushlabs' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: docker/app1-hello/springboot/hello-spring
          file: docker/app1-hello/springboot/hello-spring/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:latest
            ${{ env.DOCKER_REPO }}:${{ github.sha }}
