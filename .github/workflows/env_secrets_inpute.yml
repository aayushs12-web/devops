name: demo secrets env
on: push
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Echo
              run: echo "Hello World from second CI"

            - name: Install
              env:
                  APP_ENV: DEMO_NEW
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
              run: |
                  echo "Environment: $APP_ENV"
                  echo "Database Password: $DB_PASSWORD"
