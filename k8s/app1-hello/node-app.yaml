apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-hello-app
  labels:
    app: node-hello-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-hello-app
  template:
    metadata:
      labels:
        app: node-hello-app
    spec:
      containers:
        - name: node-hello
          image: aayushlabs/hello-node:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: ENV_VALUE
              value: "Production Node App running on Docker Desktop Kubernetes"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: node-hello-service
spec:
  type: NodePort
  selector:
    app: node-hello-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
