apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1-hello
  template:
    metadata:
      labels:
        app: app1-hello
    spec:
      containers:
        - name: app1-hello
          image: embarkx/hello-spring:latest
          #env:
          #   - name: ENV_VALUE
          #     value: "Welcome to MyApp"
          #   - name: DB_PASSWORD
          #     value: "Admin@1234"
          env:
            - name: ENV_VALUE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_MESSAGE
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD

          resources:
            requests:
              memory: "256Mi"
              cpu: "256m"
            limits:
              memory: "512Mi"
              cpu: "512m"

          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app1-hello
spec:
  type: NodePort
  selector:
    app: app1-hello
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 32000
