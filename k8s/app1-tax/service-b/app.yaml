apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
        - name: service-b
          image: embarkx/tax-service-b:latest
          #env:
          #   - name: ENV_VALUE
          #     value: "Welcome to MyApp"
          #   - name: DB_PASSWORD
          #     value: "Admin@1234"
          # env:
          # - name: ENV_VALUE
          #valueFrom:
          # configMapKeyRef:
          #   name: app-config
          #   key: APP_MESSAGE
          # - name: DB_PASSWORD
          # valueFrom:
          #  secretKeyRef:
          #   name: app-secret
          #   key: DB_PASSWORD

          resources:
            requests:
              memory: "256Mi"
              cpu: "256m"
            limits:
              memory: "512Mi"
              cpu: "512m"

          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
spec:
  type: ClusterIP
  selector:
    app: service-b
  ports:
    - port: 4000
      targetPort: 4000
