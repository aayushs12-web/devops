apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: service-a
          image: embarkx/tax-service-a:latest
          env:
            - name: TAX_SERVICE_URL
              value: "http://service-b:4000"
          #   - name: ENV_VALUE
          #     value: "Welcome to MyApp"
          #   - name: DB_PASSWORD
          #     value: "Admin@1234"
          #env:
          #  - name: ENV_VALUE
          #    valueFrom:
          #      configMapKeyRef:
          #        name: app-config
          #        key: APP_MESSAGE
          #  - name: DB_PASSWORD
          #    valueFrom:
          #      secretKeyRef:
          #        name: app-secret
          #        key: DB_PASSWORD

          resources:
            requests:
              memory: "256Mi"
              cpu: "256m"
            limits:
              memory: "512Mi"
              cpu: "512m"

          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
spec:
  type: NodePort
  selector:
    app: service-a
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 32000
